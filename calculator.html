<!DOCTYPE html>
<html>
<head>
<style>
		body{
			height: 100vh;
			width: 100%;
			background-color: skyblue;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		#calculator{
		display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 10px;
        width: 300px;
        min-height: 350px;
        background-color: pink;
        padding: 50px;
        border-radius: 15px;
        border-color: black;
        box-sizing: border-box;
		}
		#btn{
			background-color: blue;
			color: white;
		}

</style>	

</head>
<body>
	<div id='calculator'>
		<h2>Calculator</h2>
		<input id="fnum" type="number" placeholder="Enter first number">
		<select id='operator'>
			<option value="+">Add</option>
			<option value="-">Subtract</option>
			<option value="*">Multiply</option>
			<option value="/">Divide</option>

		</select>
		<input  id="snum" type="number" placeholder="Enter second number">
		<button id='btn' onclick="Calculator()">Calculate</button>
		<h3 id="result"></h3>
	</div>
</body>
<script>
		function Calculator(){
			
			let firstNum=parseFloat(document.getElementById('fnum').value);
			let SecondNum=parseFloat(document.getElementById('snum').value);
			let value=document.getElementById('operator').value;
			if(isNaN(firstNum) || isNaN(SecondNum)){
				document.getElementById("result").innerText="Enter both numbers";
				return ;
			}
			var result;
			if(value=='+'){
				result=firstNum+SecondNum;
			}
			else if(value=='-'){
				result=firstNum-SecondNum;
			}
			else if(value=='*'){
				result=firstNum*SecondNum;
			}
			else if(value=='/'){
				result=firstNum/SecondNum;
			}
			document.getElementById('result').innerText=result;
		}


</script>




</html>
